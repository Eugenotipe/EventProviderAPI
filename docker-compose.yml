services:
  db:
    image: postgres:16-alpine
    container_name: eventprovider-db
    environment:
      POSTGRES_USER: eventprovider
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: eventprovider
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventprovider -d eventprovider"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: eventprovider-app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://eventprovider:secret@db:5432/eventprovider
      APP: EventProvider
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: